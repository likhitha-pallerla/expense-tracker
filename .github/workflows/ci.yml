name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"
          cache: maven

      # Compile and unit-test only. Flyway and the datasource are not exercised
      # here because CI has no Supabase credentials; schema changes are verified
      # on deploy.
      - name: Build and test
        run: mvn -B verify

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      # Node 24 runs TypeScript directly, which is what lets `npm test` below
      # work with no test framework -- the same arrangement the mobile app
      # uses. Do not drop below it.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run lint

      # Covers the analytics path scrubber, which is what keeps transaction ids
      # out of a third party's records.
      - run: npm test

      # src/lib/env.ts throws when these are unset, so the build needs
      # syntactically valid placeholders. They are never used to reach Supabase.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      # Node 24 runs TypeScript directly, so the tests need no build step and no
      # test framework. Do not drop below it: type stripping is what makes
      # `node --test` work on these files at all.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # Covers the on-device SMS filter, the offline queue and the scan window.
      # The filter tests read packages/shared/sms-filter-vectors.json, the same
      # file the Java suite reads, so the two implementations cannot drift.
      - run: npm test
