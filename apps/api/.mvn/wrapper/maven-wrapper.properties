# Pins the Maven version so the Docker build on Render, CI and a laptop all
# use the same one. The generator wrote "apache-maven-3-bin.zip" here, which is
# not a real version and 404s on download.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
