spring:
  application:
    name: expense-tracker-api

  # Loads the repo-root .env as properties in local development.
  # Deployed environments provide real environment variables instead.
  config:
    import: "optional:file:../../.env[.properties]"

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      # Supabase's session pooler sits in front of Postgres; keep the pool small.
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Supabase owns the auth/storage schemas; only manage our own.
    schemas: public

server:
  # Render assigns a port and passes it as PORT; nothing else is listened on,
  # so a service that ignores it never passes its health check. SERVER_PORT
  # stays as the local override, and 8080 as the fallback for both.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: always

supabase:
  url: ${SUPABASE_URL}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  encryption:
    # 32 bytes, base64. Generate with: openssl rand -base64 32
    # Absent is survivable: only mailbox connections need it.
    key: ${TOKEN_ENCRYPTION_KEY:}

  oauth:
    # Must match the redirect URI registered with each provider exactly.
    api-base: ${OAUTH_API_BASE:http://localhost:8080}
    web-base: ${OAUTH_WEB_BASE:http://localhost:3000}
    state-ttl-seconds: ${OAUTH_STATE_TTL_SECONDS:600}

    gmail:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      # Endpoints are configurable so the whole handshake can be pointed at a
      # stub and tested; they are not expected to change in production.
      authorize-uri: ${GOOGLE_AUTHORIZE_URI:https://accounts.google.com/o/oauth2/v2/auth}
      token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
      user-info-uri: ${GOOGLE_USERINFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
      revoke-uri: ${GOOGLE_REVOKE_URI:https://oauth2.googleapis.com/revoke}

    outlook:
      client-id: ${MICROSOFT_CLIENT_ID:}
      client-secret: ${MICROSOFT_CLIENT_SECRET:}
      authorize-uri: ${MICROSOFT_AUTHORIZE_URI:https://login.microsoftonline.com/common/oauth2/v2.0/authorize}
      token-uri: ${MICROSOFT_TOKEN_URI:https://login.microsoftonline.com/common/oauth2/v2.0/token}
      user-info-uri: ${MICROSOFT_USERINFO_URI:https://graph.microsoft.com/v1.0/me}
      # Microsoft has no per-token revocation endpoint; signing out of all
      # sessions is the nearest equivalent and is far more than was asked.
      revoke-uri: ${MICROSOFT_REVOKE_URI:}

  mail:
    # Where the mail APIs live. Configurable only so sync can be pointed at a
    # stub and driven end to end without a real mailbox; never set in production.
    gmail-base: ${GMAIL_API_BASE:https://gmail.googleapis.com}
    graph-base: ${GRAPH_API_BASE:https://graph.microsoft.com}

  ai:
    # Off unless someone deliberately turns it on. Every feature built on this
    # has a deterministic path that runs first, so no key is the normal state
    # of this application rather than a broken one.
    enabled: ${AI_ENABLED:false}
    api-key: ${AI_API_KEY:}
    # Any OpenAI-compatible /chat/completions endpoint: Groq, OpenRouter,
    # Together, DeepSeek or a local Ollama all work without a code change.
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
    # Per user, per day. A cap this project can afford to have hit.
    daily-call-budget: ${AI_DAILY_CALL_BUDGET:200}
    # Below this the model's reading of an alert is recorded as a failure
    # rather than turned into a transaction.
    min-confidence: ${AI_MIN_CONFIDENCE:0.75}

  rate-limit:
    # Burst limits, per user, held in memory on this instance. They exist so
    # one account cannot make a small shared machine unusable for everyone
    # else. A person using the application normally will never meet them.
    enabled: ${RATE_LIMIT_ENABLED:true}
    read-per-minute: ${RATE_LIMIT_READ_PER_MINUTE:300}
    write-per-minute: ${RATE_LIMIT_WRITE_PER_MINUTE:60}
    # Mailbox sync, message parsing and statement import: a network round trip
    # and a write per transaction found, so charged by the hour rather than the
    # minute.
    sync-per-hour: ${RATE_LIMIT_SYNC_PER_HOUR:30}
    # Anything that can reach a model. The AI's own daily budget caps the day;
    # this stops a client spending all of it in a minute.
    ai-per-hour: ${RATE_LIMIT_AI_PER_HOUR:60}
    # Per IP, for the OAuth callback and anything else with no user yet.
    anonymous-per-minute: ${RATE_LIMIT_ANONYMOUS_PER_MINUTE:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Error reporting. Off unless SENTRY_DSN is set, which is how a fork, a
# contributor and a local checkout all run without an account.
#
# The settings below matter as much as the DSN does: this application handles
# bank alerts and transaction amounts, and Sentry's defaults would attach them
# to every event. See SentryConfig for the scrubbing that backs these up.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  # Never attach the email, IP address or username of the person who hit the
  # error. The user id is added back deliberately in SentryConfig.
  send-default-pii: false
  # Request bodies here are bank alerts and transactions. None of them help
  # anyone read a stack trace.
  max-request-body-size: none
  # Performance tracing off: it is quota this project would rather spend on
  # actual errors, and the timings are already in the logs.
  traces-sample-rate: 0
  # 4xx are the client's problem and would drown the 5xx that are ours.
  exception-resolver-order: 2147483647
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

logging:
  level:
    org.flywaydb: INFO
    com.expensetracker: DEBUG
