spring:
  application:
    name: expense-tracker-api

  # Loads the repo-root .env as properties in local development.
  # Deployed environments provide real environment variables instead.
  config:
    import: "optional:file:../../.env[.properties]"

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      # Supabase's session pooler sits in front of Postgres; keep the pool small.
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Supabase owns the auth/storage schemas; only manage our own.
    schemas: public

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

supabase:
  url: ${SUPABASE_URL}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.flywaydb: INFO
    com.expensetracker: DEBUG
