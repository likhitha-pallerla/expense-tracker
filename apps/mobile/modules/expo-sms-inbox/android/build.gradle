apply plugin: "com.android.library"
apply plugin: "kotlin-android"

group = "expo.modules.smsinbox"
version = "0.1.0"

android {
  namespace "expo.modules.smsinbox"
  compileSdk safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 24)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation project(":expo-modules-core")
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${safeExtGet("kotlinVersion", "2.0.21")}"
  implementation "androidx.core:core-ktx:1.13.1"
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
